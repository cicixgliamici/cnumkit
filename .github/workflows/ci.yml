name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Doxygen / public API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Generate documentation
        run: doxygen Doxyfile

  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.linkage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Debug
            linkage: shared
            shared: ON
            contracts: OFF
            sanitizers: OFF
            run_tests: true
          - compiler: gcc
            build_type: Release
            linkage: static
            shared: OFF
            contracts: OFF
            sanitizers: OFF
            run_tests: true
          - compiler: clang
            build_type: Debug
            linkage: static-sanitized
            shared: OFF
            contracts: OFF
            sanitizers: ON
            run_tests: true
          - compiler: gcc
            build_type: Debug
            linkage: static-contracts-build
            shared: OFF
            contracts: ON
            sanitizers: OFF
            run_tests: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCNUMKIT_ENABLE_CONTRACTS=${{ matrix.contracts }} -DCNUMKIT_ENABLE_SANITIZERS=${{ matrix.sanitizers }} -DCNUMKIT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake --install build --config ${{ matrix.build_type }} --prefix "$PWD/build/package"

      - name: Configure external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$PWD/build/package"

      - name: Build external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake --build build/consumer --parallel

      - name: Run external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: ./build/consumer/cnumkit_external_consumer

      - name: Archive installed Linux package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: tar -C build/package -czf cnumkit-linux-${{ matrix.linkage }}.tar.gz .

      - name: Upload Linux package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.linkage }}
          path: cnumkit-linux-${{ matrix.linkage }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows / MSVC / ${{ matrix.build_type }} / ${{ matrix.linkage }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            linkage: shared
            shared: ON
            contracts: OFF
          - build_type: Release
            linkage: static
            shared: OFF
            contracts: OFF
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCNUMKIT_ENABLE_CONTRACTS=${{ matrix.contracts }} -DCNUMKIT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install package
        run: cmake --install build --config ${{ matrix.build_type }} --prefix "$pwd/build/package"

      - name: Configure external consumer
        run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH="$pwd/build/package"

      - name: Build external consumer
        run: cmake --build consumer --config ${{ matrix.build_type }} --parallel

      - name: Run external consumer
        run: |
          # The shared build needs the installed DLL on the process search path.
          $env:PATH = "$pwd/build/package/bin;$env:PATH"
          & "./consumer/${{ matrix.build_type }}/cnumkit_external_consumer.exe"

      - name: Archive installed Windows package
        run: Compress-Archive -Path build/package/* -DestinationPath cnumkit-windows-${{ matrix.linkage }}.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ matrix.linkage }}
          path: cnumkit-windows-${{ matrix.linkage }}.zip
          if-no-files-found: error

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [documentation, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify tag matches CMake version
        run: |
          version=$(sed -n 's/^project(cnumkit VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Download installable packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Verify release assets
        run: |
          test -f dist/cnumkit-linux-shared.tar.gz
          test -f dist/cnumkit-linux-static.tar.gz
          test -f dist/cnumkit-windows-shared.zip
          test -f dist/cnumkit-windows-static.zip
          sha256sum dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md

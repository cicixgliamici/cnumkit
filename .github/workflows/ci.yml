name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Doxygen / public API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Generate documentation
        run: doxygen Doxyfile

  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.linkage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Debug
            linkage: shared
            shared: ON
            contracts: OFF
            sanitizers: OFF
            run_tests: true
          - compiler: gcc
            build_type: Release
            linkage: static
            shared: OFF
            contracts: OFF
            sanitizers: OFF
            run_tests: true
          - compiler: clang
            build_type: Debug
            linkage: static-sanitized
            shared: OFF
            contracts: OFF
            sanitizers: ON
            run_tests: true
    env:
      CC: ${{ matrix.compiler }}
      # Keep the C++ smoke test on the same sanitizer runtime as the C library.
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCNUMKIT_ENABLE_CONTRACTS=${{ matrix.contracts }} -DCNUMKIT_ENABLE_SANITIZERS=${{ matrix.sanitizers }} -DCNUMKIT_WARNINGS_AS_ERRORS=ON -DCNUMKIT_BUILD_CPP_SMOKE_TEST=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake --install build --config ${{ matrix.build_type }} --prefix "$PWD/build/package"

      - name: Archive and relocate installed Linux package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: |
          tar -C build/package -czf cnumkit-linux-${{ matrix.linkage }}.tar.gz .
          # Hide the installation prefix so absolute paths cannot mask defects.
          mv build/package build/original-package
          mkdir build/relocated
          tar -C build/relocated -xzf cnumkit-linux-${{ matrix.linkage }}.tar.gz

      - name: Configure external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$PWD/build/relocated"

      - name: Build external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: cmake --build build/consumer --parallel

      - name: Run external consumer
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        run: ctest --test-dir build/consumer --output-on-failure

      - name: Upload Linux package
        if: matrix.run_tests && matrix.sanitizers == 'OFF'
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.linkage }}
          path: cnumkit-linux-${{ matrix.linkage }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows / MSVC / ${{ matrix.build_type }} / ${{ matrix.linkage }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            linkage: shared
            shared: ON
            contracts: OFF
          - build_type: Release
            linkage: static
            shared: OFF
            contracts: OFF
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCNUMKIT_ENABLE_CONTRACTS=${{ matrix.contracts }} -DCNUMKIT_WARNINGS_AS_ERRORS=ON -DCNUMKIT_BUILD_CPP_SMOKE_TEST=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install package
        run: cmake --install build --config ${{ matrix.build_type }} --prefix "$pwd/build/package"

      - name: Archive and relocate installed Windows package
        run: |
          Compress-Archive -Path build/package/* -DestinationPath cnumkit-windows-${{ matrix.linkage }}.zip
          # Test the archive with the original installation prefix unavailable.
          Move-Item -LiteralPath build/package -Destination build/original-package
          Expand-Archive -LiteralPath cnumkit-windows-${{ matrix.linkage }}.zip -DestinationPath build/relocated

      - name: Configure external consumer
        run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH="$pwd/build/relocated"

      - name: Build external consumer
        run: cmake --build consumer --config ${{ matrix.build_type }} --parallel

      - name: Run external consumer
        run: |
          # The shared build needs the installed DLL on the process search path.
          $env:PATH = "$pwd/build/relocated/bin;$env:PATH"
          ctest --test-dir consumer -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ matrix.linkage }}
          path: cnumkit-windows-${{ matrix.linkage }}.zip
          if-no-files-found: error

  contracts:
    name: Contracts / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure contract-enabled library
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=OFF -DCNUMKIT_ENABLE_CONTRACTS=ON -DCNUMKIT_WARNINGS_AS_ERRORS=ON -DCNUMKIT_BUILD_CPP_SMOKE_TEST=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test public errors and isolated contract deaths
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [documentation, linux, windows, contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify tag matches CMake version
        run: |
          version=$(sed -n 's/^project(cnumkit VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Download installable packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Verify release assets
        run: |
          test -f dist/cnumkit-linux-shared.tar.gz
          test -f dist/cnumkit-linux-static.tar.gz
          test -f dist/cnumkit-windows-shared.zip
          test -f dist/cnumkit-windows-static.zip
          # Publish checksums so downloaded archives can be verified offline.
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
